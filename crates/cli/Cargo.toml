[package]
name = "storage-cleaner-cli"
description = "Command-line interface for storageCleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "storagecleaner"
path = "src/main.rs"

[dependencies]
storage-cleaner-core.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow = "1"
console = "0.16"
indicatif = "0.18"
