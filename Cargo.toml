[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Lasha Khvichia"]
repository = "https://github.com/Lasha-Khvichia/storageCleaner"

[workspace.dependencies]
storage-cleaner-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
trash = "5"
dirs = "6"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
